name: Jekyllビルド＆GitHub Pages公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎日9時50分（JST）に再ビルド → 当日付の予約記事が公開される
    - cron: '50 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Rubyセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Pages設定
        uses: actions/configure-pages@v5

      - name: Jekyllビルド
        env:
          JEKYLL_ENV: production
          TZ: Asia/Tokyo
        run: bundle exec jekyll build

      - name: ビルド成果物アップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
